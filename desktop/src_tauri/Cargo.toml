[package]
name = "vxclean"
version = "0.1.0"
description = "VXClean — Desktop System Monitor & Maintenance Bridge"
authors = ["vic"]
edition = "2021"

[lib]
name = "vxclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
