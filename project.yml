name: MClean
options:
  bundleIdPrefix: local.vxclean
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    # Universal only where it matters (Release, overridden below). Debug builds
    # just the active arch for ~2x faster local iteration.
    ONLY_ACTIVE_ARCH: "YES"
    DEAD_CODE_STRIPPING: "YES"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: "Manual"
    CODE_SIGN_ENTITLEMENTS: "MClean/MClean.entitlements"
    INFOPLIST_FILE: "MClean/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "local.vxclean.app"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"
  configs:
    Release:
      # Shipped builds stay universal; strip symbols from the executable
      # (crash symbolication still works via the separate dSYM).
      ONLY_ACTIVE_ARCH: "NO"
      STRIP_INSTALLED_PRODUCT: "YES"
      STRIP_STYLE: "non-global"

targets:
  MClean:
    type: application
    platform: macOS
    sources:
      - MClean
    settings:
      base:
        PRODUCT_NAME: VXClean
        PRODUCT_MODULE_NAME: MClean
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      # Local ad-hoc signing changes cdhash per build, which may require
      # re-granting TCC/Full Disk Access across rebuilds.

  MCleanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MCleanTests
    dependencies:
      - target: MClean
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VXClean.app/Contents/MacOS/VXClean"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MClean:
    build:
      targets:
        MClean: all
        MCleanTests: [test]
    test:
      targets:
        - name: MCleanTests
