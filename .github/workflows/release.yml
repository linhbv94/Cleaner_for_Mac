name: Desktop release (free public runners)

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop_release_${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.draft.outputs.tag }}
      asset_prefix: ${{ steps.draft.outputs.asset_prefix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check versions and signing configuration
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/validate_release.mjs "$RELEASE_TAG"
      - name: Prepare draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare_release.mjs

  build:
    needs: prepare
    if: github.event.repository.private == false
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Serialize uploads so tauri-action can safely merge all platforms in latest.json.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            asset_platform: macos_silicon
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            asset_platform: macos_intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Rust safety and journal regression
        run: cargo test --locked --lib
        working-directory: desktop/src_tauri
      - name: Native safety and lifecycle fixtures
        run: python3 scripts/test_native_maintenance.py
      - name: Manager cleanup fixtures
        run: python3 scripts/test_manager_cleanup.py
      - name: Frontend state regression
        run: |
          node scripts/test_scan_access.mjs
          node scripts/test_scan_retention.cjs
          node scripts/test_operation_history.mjs
          node scripts/test_folder_scan_cache.mjs
          node scripts/test_uninstall_selection.cjs
          node scripts/test_circle_packing.cjs
      - name: Test release automation
        run: node --test scripts/test_release_automation.mjs
      - name: Install stable macOS signing identity
        env:
          VXCLEAN_MACOS_CERTIFICATE: ${{ secrets.VXCLEAN_MACOS_CERTIFICATE }}
          VXCLEAN_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.VXCLEAN_MACOS_CERTIFICATE_PASSWORD }}
        run: python3 scripts/ci_macos_signer.py install
      - name: Build and upload signed updater packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # Signatures remain embedded in latest.json; omit duplicate standalone files.
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: false
          releaseAssetNamePattern: '${{ needs.prepare.outputs.asset_prefix }}_[version]_${{ matrix.asset_platform }}[_setup][ext]'
          projectPath: desktop
          tauriScript: npm run tauri
          args: --config "${{ env.VXCLEAN_SIGNER_CONFIG }}" --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify certificate-bound package identity
        run: |
          APP="desktop/src_tauri/target/${{ matrix.target }}/release/bundle/macos/VXClean.app"
          codesign --verify --deep --strict "$APP"
          codesign -d -r- "$APP" 2>&1 | grep -F 'certificate leaf = H"fe024021592c718a39ad70b76d2edc5da0cd6b70"'
      - name: Remove temporary signing identity
        if: always()
        run: python3 scripts/ci_macos_signer.py cleanup

  validate:
    needs: [prepare, build]
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate layout, verify signatures and finalize user notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/vx_updater"
          node scripts/finalize_release.mjs "$RUNNER_TEMP/vx_updater/latest.json"
